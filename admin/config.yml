backend:
  name: git-gateway
  branch: main
  repo: willi/tst-website

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "📋 站点设置"
    files:
      - name: "site"
        label: "联系信息（显示在页脚 + 联系页）"
        file: "data/site.json"
        fields:
          - {label: "诊所名称", name: "clinic_name", widget: "string", default: "TST 男性健康管理中心"}
          - {label: "地址", name: "address", widget: "string", default: "杭州市萧山区"}
          - {label: "电话", name: "phone", widget: "string"}
          - {label: "微信", name: "wechat", widget: "string"}
          - {label: "营业时间", name: "hours", widget: "string", default: "周一至周六 09:00-18:00（周日休诊）"}
          - {label: "预约说明", name: "booking_note", widget: "text", default: "电话 / 微信预约，不接受无预约直接到院"}
          - {label: "驾车指引", name: "driving", widget: "text"}
          - {label: "最近地铁", name: "subway", widget: "string"}
          - {label: "备案号（如浙ICP备XXX）", name: "icp", widget: "string"}

  - name: "blog"
    label: "📝 健康科普"
    label_singular: "文章"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — {{date}}"
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
      - label: "封面图 → 1200×630px 横版最佳"
        name: "image"
        widget: "image"
        required: false
      - {label: "摘要（卡片上显示）", name: "excerpt", widget: "text"}
      - {label: "分类", name: "category", widget: "select", options: ["睾酮优化", "ED科学应对", "男性抗衰", "代谢重塑", "多肽精准营养", "男性心理", "生活方式"]}
      - {label: "正文", name: "body", widget: "markdown"}

  - name: "pages"
    label: "📄 页面内容"
    files:
      - name: "hero"
        label: "🏠 首页 Hero 大标题"
        file: "data/hero.json"
        fields:
          - {label: "大标题", name: "title", widget: "string", default: "RECLAIM YOUR PRIME"}
          - {label: "副标题", name: "subtitle", widget: "string", default: "睾酮优化 · 精准抗衰 · 男性健康管理"}
          - {label: "按钮文字", name: "cta_text", widget: "string", default: "申请加入 TST"}

      - name: "about"
        label: "📄 关于我们"
        file: "data/about.json"
        fields:
          - {label: "页面标题", name: "heading", widget: "string", default: "关于 TST"}
          - {label: "介绍", name: "description", widget: "markdown"}
          - {label: "使命", name: "mission", widget: "markdown"}

      - name: "services"
        label: "💪 六大服务"
        file: "data/services.json"
        fields:
          - label: "服务列表"
            name: "items"
            widget: "list"
            fields:
              - {label: "中文名", name: "name_cn", widget: "string"}
              - {label: "英文名", name: "name_en", widget: "string"}
              - {label: "一句话描述", name: "tagline", widget: "string"}
              - {label: "详细介绍", name: "description", widget: "markdown", required: false}
