backend:
  name: git-gateway
  branch: main
  repo: willi/tst-website

media_folder: "images/uploads"
public_folder: "/images/uploads"

# Enable draft/publish workflow
publish_mode: editorial_workflow

collections:
  - name: "settings"
    label: "📋 站点设置"
    description: "电话、地址、微信等基本信息"
    preview_path: "site-settings"
    files:
      - name: "site"
        label: "联系信息"
        file: "data/site.json"
        preview_path: "site-settings"
        fields:
          - {label: "诊所名称", name: "clinic_name", widget: "string", default: "TST 男性健康管理中心"}
          - {label: "地址（页脚+联系页显示）", name: "address", widget: "string", default: "杭州市萧山区"}
          - {label: "电话", name: "phone", widget: "string"}
          - {label: "微信", name: "wechat", widget: "string"}
          - {label: "营业时间", name: "hours", widget: "string", default: "周一至周六 09:00-18:00（周日休诊）"}
          - {label: "预约说明", name: "booking_note", widget: "text", default: "电话 / 微信预约，不接受无预约直接到院"}
          - {label: "驾车指引", name: "driving", widget: "text"}
          - {label: "最近地铁", name: "subway", widget: "string"}
          - {label: "备案号", name: "icp", widget: "string", hint: "浙ICP备XXXXXXXX号"}

  - name: "blog"
    label: "📝 健康科普文章"
    label_singular: "文章"
    folder: "content/blog"
    create: true
    preview_path: "blog"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD"}
      - label: "封面图（1200×630px最佳，显示在列表卡片上）"
        name: "image"
        widget: "image"
        required: false
        hint: "建议尺寸 1200×630px，横版。在博客列表页显示为卡片封面。"
      - {label: "摘要（会显示在列表卡片上）", name: "excerpt", widget: "text"}
      - {label: "分类", name: "category", widget: "select", options: ["睾酮优化", "ED科学应对", "男性抗衰", "代谢重塑", "多肽精准营养", "男性心理", "生活方式"]}
      - {label: "正文", name: "body", widget: "markdown"}

  - name: "pages"
    label: "📄 页面内容"
    files:
      - name: "hero"
        label: "🏠 首页 Hero"
        preview_path: "hero"
        file: "data/hero.json"
        fields:
          - {label: "主标题", name: "title", widget: "string", default: "RECLAIM YOUR PRIME"}
          - {label: "副标题", name: "subtitle", widget: "string", default: "睾酮优化 · 精准抗衰 · 男性健康管理"}
          - {label: "按钮文字", name: "cta_text", widget: "string", default: "申请加入 TST"}
          - {label: "按钮链接", name: "cta_link", widget: "string", default: "/contact.html"}

      - name: "about"
        label: "📄 关于我们"
        preview_path: "about"
        file: "data/about.json"
        fields:
          - {label: "页面标题", name: "heading", widget: "string", default: "关于 TST"}
          - {label: "主描述", name: "description", widget: "markdown"}
          - {label: "使命愿景", name: "mission", widget: "markdown"}

      - name: "services"
        label: "💪 服务项目"
        preview_path: "services"
        file: "data/services.json"
        fields:
          - label: "六大服务"
            name: "items"
            widget: "list"
            fields:
              - {label: "中文名称", name: "name_cn", widget: "string"}
              - {label: "英文名称", name: "name_en", widget: "string"}
              - {label: "简短描述", name: "tagline", widget: "string"}
              - {label: "详细介绍", name: "description", widget: "markdown"}

  - name: "content"
    label: "🧩 首页内容块"
    folder: "data/blocks"
    create: true
    identifier_field: "title"
    fields:
      - {label: "标题", name: "title", widget: "string"}
      - {label: "英文标签", name: "label_en", widget: "string"}
      - {label: "描述", name: "body", widget: "markdown"}
      - label: "配图"
        name: "image"
        widget: "image"
        required: false
        hint: "建议 800×600px 以上，会根据内容块自适应大小。"
